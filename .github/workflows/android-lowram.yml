name: Eden Galaxy LowRAM Android
on:
  workflow_dispatch:
jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'
    steps:
      - name: Checkout Eden LowRAM
        uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.31.6'
          df -h .
      - name: Prepare SDL3 Android Java bindings
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch release-3.4.8 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/sdl3-sources"
          git -C "$RUNNER_TEMP/sdl3-sources" sparse-checkout set android-project/app/src/main/java/org/libsdl/app
          mkdir -p externals/generated/sdl/java/org/libsdl/app
          cp "$RUNNER_TEMP/sdl3-sources"/android-project/app/src/main/java/org/libsdl/app/*.java externals/generated/sdl/java/org/libsdl/app/
          test -s externals/generated/sdl/java/org/libsdl/app/SDL.java
          echo "SDL3 Java bindings present before Kotlin compilation"
      - name: Build standalone LowRAM APK
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleMainlineRelWithDebInfo -Pnightly=false --no-daemon --max-workers=2 --stacktrace
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Galaxy-LowRAM-Android
          path: src/android/app/build/outputs/apk/mainline/relWithDebInfo/*.apk
          if-no-files-found: error
          retention-days: 7
